.b{position:absolute}

.dt{text-decoration:underline dotted #5f6368;text-underline-offset:4px}


/* interaction layer: GA-style behavior without moving the report layout */
.hotspot{position:absolute;z-index:900;border:0;padding:0;margin:0;background:transparent;cursor:pointer;border-radius:8px;font:inherit;transition:background .12s ease,transform .08s ease}
.hotspot:hover{background:rgba(26,115,232,.045)}
.hotspot:active{background:rgba(26,115,232,.09);transform:scale(.985)}
.real-input{position:absolute;z-index:910;border:0;outline:0;color:#202124;font:inherit;box-sizing:border-box}
.real-input:focus{box-shadow:inset 0 0 0 2px rgba(26,115,232,.20)}
.ui-pop{position:absolute;z-index:6200;min-width:240px;max-width:380px;background:#fff;border:1px solid #dadce0;border-radius:10px;box-shadow:0 10px 30px rgba(60,64,67,.24);padding:7px;display:none;color:#202124;font-family:Roboto,Arial,sans-serif}
.ui-pop.open{display:block;animation:popIn .14s cubic-bezier(.2,.8,.2,1)}
.ui-pop-title{padding:8px 10px 7px;font-size:14px;font-weight:700}
.ui-pop-sub{padding:0 10px 8px;font-size:12px;line-height:1.45;color:#5f6368}
.ui-pop-divider{height:1px;background:#e8eaed;margin:5px 3px}
.ui-pop button,.ui-pop a.ui-menu-link{display:flex;align-items:center;gap:10px;width:100%;border:0;background:#fff;text-align:left;padding:10px 11px;border-radius:7px;color:#202124;font:500 13px Roboto,Arial,sans-serif;cursor:pointer;text-decoration:none;box-sizing:border-box}
.ui-pop button:hover,.ui-pop a.ui-menu-link:hover{background:#f1f3f4}
.ui-pop button.selected{background:#e8f0fe;color:#0b57d0}
.ui-pop button:disabled{color:#9aa0a6;cursor:default;background:#fff}
.ui-menu-icon{width:18px;text-align:center;color:#5f6368}
.ui-pop-note{padding:9px 10px;font-size:12px;color:#5f6368;line-height:1.45;background:#f8fafd;border-radius:7px;margin:4px}
.ui-toast{position:absolute;z-index:7000;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:#303134;color:#fff;border-radius:5px;padding:10px 15px;font:13px Roboto,Arial,sans-serif;opacity:0;pointer-events:none;transition:.18s;box-shadow:0 3px 12px rgba(0,0,0,.18)}
.ui-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ui-modal-backdrop{position:absolute;z-index:6500;inset:0;background:rgba(32,33,36,.30);display:flex;align-items:center;justify-content:center;animation:fadeIn .14s ease}
.ui-modal{width:min(520px,calc(100% - 80px));max-height:72%;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 18px 60px rgba(60,64,67,.32);font-family:Roboto,Arial,sans-serif;color:#202124}
.ui-modal-head{display:flex;align-items:center;justify-content:space-between;padding:17px 19px 12px;border-bottom:1px solid #e8eaed;font-size:17px;font-weight:600}
.ui-modal-close{border:0;background:transparent;font-size:22px;color:#5f6368;cursor:pointer;border-radius:50%;width:32px;height:32px}
.ui-modal-close:hover{background:#f1f3f4}
.ui-modal-body{padding:17px 19px;font-size:13px;line-height:1.55}
.ui-modal-foot{padding:11px 19px 16px;display:flex;justify-content:flex-end;gap:9px}
.ui-btn{border:1px solid #dadce0;background:#fff;border-radius:6px;padding:8px 13px;font:500 13px Roboto,Arial,sans-serif;color:#1a73e8;cursor:pointer}
.ui-btn:hover{background:#f8fafd}
.ui-btn.primary{background:#1a73e8;color:#fff;border-color:#1a73e8}
.ui-search-results{position:absolute;z-index:6300;background:#fff;border:1px solid #dadce0;border-radius:0 0 9px 9px;box-shadow:0 8px 24px rgba(60,64,67,.20);overflow:hidden;font-family:Roboto,Arial,sans-serif}
.ui-search-results a{display:flex;align-items:center;gap:10px;padding:10px 13px;text-decoration:none;color:#202124;font-size:13px;border-top:1px solid #f1f3f4}
.ui-search-results a:first-child{border-top:0}
.ui-search-results a:hover,.ui-search-results a.active{background:#f1f3f4}
.ui-search-results .sicon{width:20px;color:#5f6368;text-align:center}
.ui-chip{position:absolute;z-index:970;display:flex;align-items:center;gap:7px;background:#e8f0fe;border:1px solid #aecbfa;color:#174ea6;border-radius:16px;padding:5px 9px;font:500 12px Roboto,Arial,sans-serif;box-shadow:0 1px 2px rgba(60,64,67,.12)}
.ui-chip button{border:0;background:transparent;color:#174ea6;cursor:pointer;font-size:15px;line-height:1;padding:0}
.ui-tooltip{position:absolute;z-index:6400;pointer-events:none;background:#fff;border:1px solid #dadce0;border-radius:7px;box-shadow:0 4px 14px rgba(60,64,67,.20);padding:8px 10px;font:12px Roboto,Arial,sans-serif;color:#202124;display:none;min-width:125px}
.ui-crosshair{position:absolute;z-index:899;width:1px;background:#dadce0;pointer-events:none;display:none}
.ui-feedback textarea{width:100%;min-height:90px;border:1px solid #dadce0;border-radius:7px;padding:9px;resize:vertical;font:13px Roboto,Arial,sans-serif;box-sizing:border-box;outline:none}
.ui-feedback textarea:focus{border-color:#1a73e8;box-shadow:0 0 0 1px #1a73e8}
.c{transition:box-shadow .16s ease}
.c:hover{box-shadow:0 2px 8px rgba(60,64,67,.22)}
@keyframes popIn{from{opacity:0;transform:translateY(-5px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes lineDraw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
