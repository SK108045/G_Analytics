html,body{margin:0;background:#f8fafd}
body{overflow-x:hidden;font-family:'Google Sans',Roboto,Arial,sans-serif;color:#202124}
#w{width:100%;overflow:hidden}
#s{position:relative;width:1536px;height:864px;transform-origin:0 0;background:#f8fafd;overflow:hidden}
.t{position:absolute;transform:translateY(-50%);white-space:nowrap}
.b{position:absolute}
.ce{transform:translate(-50%,-50%)}
.dt{text-decoration:underline dotted #5f6368;text-underline-offset:4px}


/* interaction layer: GA-style behavior without moving the report layout */
.hotspot{position:absolute;z-index:900;border:0;padding:0;margin:0;background:transparent;cursor:pointer;border-radius:8px;font:inherit;transition:background .12s ease,transform .08s ease}
.hotspot:hover{background:rgba(26,115,232,.045)}
.hotspot:active{background:rgba(26,115,232,.09);transform:scale(.985)}
.real-input{position:absolute;z-index:910;border:0;outline:0;color:#202124;font:inherit;box-sizing:border-box}
.real-input:focus{box-shadow:inset 0 0 0 2px rgba(26,115,232,.20)}
.ui-pop{position:absolute;z-index:6200;min-width:240px;max-width:380px;background:#fff;border:1px solid #dadce0;border-radius:10px;box-shadow:0 10px 30px rgba(60,64,67,.24);padding:7px;display:none;color:#202124;font-family:Roboto,Arial,sans-serif}
.ui-pop.open{display:block;animation:popIn .14s cubic-bezier(.2,.8,.2,1)}
.ui-pop-title{padding:8px 10px 7px;font-size:14px;font-weight:700}
.ui-pop-sub{padding:0 10px 8px;font-size:12px;line-height:1.45;color:#5f6368}
.ui-pop-divider{height:1px;background:#e8eaed;margin:5px 3px}
.ui-pop button,.ui-pop a.ui-menu-link{display:flex;align-items:center;gap:10px;width:100%;border:0;background:#fff;text-align:left;padding:10px 11px;border-radius:7px;color:#202124;font:500 13px Roboto,Arial,sans-serif;cursor:pointer;text-decoration:none;box-sizing:border-box}
.ui-pop button:hover,.ui-pop a.ui-menu-link:hover{background:#f1f3f4}
.ui-pop button.selected{background:#e8f0fe;color:#0b57d0}
.ui-pop button:disabled{color:#9aa0a6;cursor:default;background:#fff}
.ui-menu-icon{width:18px;text-align:center;color:#5f6368}
.ui-pop-note{padding:9px 10px;font-size:12px;color:#5f6368;line-height:1.45;background:#f8fafd;border-radius:7px;margin:4px}
.ui-toast{position:absolute;z-index:7000;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:#303134;color:#fff;border-radius:5px;padding:10px 15px;font:13px Roboto,Arial,sans-serif;opacity:0;pointer-events:none;transition:.18s;box-shadow:0 3px 12px rgba(0,0,0,.18)}
.ui-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ui-modal-backdrop{position:absolute;z-index:6500;inset:0;background:rgba(32,33,36,.30);display:flex;align-items:center;justify-content:center;animation:fadeIn .14s ease}
.ui-modal{width:min(520px,calc(100% - 80px));max-height:72%;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 18px 60px rgba(60,64,67,.32);font-family:Roboto,Arial,sans-serif;color:#202124}
.ui-modal-head{display:flex;align-items:center;justify-content:space-between;padding:17px 19px 12px;border-bottom:1px solid #e8eaed;font-size:17px;font-weight:600}
.ui-modal-close{border:0;background:transparent;font-size:22px;color:#5f6368;cursor:pointer;border-radius:50%;width:32px;height:32px}
.ui-modal-close:hover{background:#f1f3f4}
.ui-modal-body{padding:17px 19px;font-size:13px;line-height:1.55}
.ui-modal-foot{padding:11px 19px 16px;display:flex;justify-content:flex-end;gap:9px}
.ui-btn{border:1px solid #dadce0;background:#fff;border-radius:6px;padding:8px 13px;font:500 13px Roboto,Arial,sans-serif;color:#1a73e8;cursor:pointer}
.ui-btn:hover{background:#f8fafd}
.ui-btn.primary{background:#1a73e8;color:#fff;border-color:#1a73e8}
.ui-search-results{position:absolute;z-index:6300;background:#fff;border:1px solid #dadce0;border-radius:0 0 9px 9px;box-shadow:0 8px 24px rgba(60,64,67,.20);overflow:hidden;font-family:Roboto,Arial,sans-serif}
.ui-search-results a{display:flex;align-items:center;gap:10px;padding:10px 13px;text-decoration:none;color:#202124;font-size:13px;border-top:1px solid #f1f3f4}
.ui-search-results a:first-child{border-top:0}
.ui-search-results a:hover,.ui-search-results a.active{background:#f1f3f4}
.ui-search-results .sicon{width:20px;color:#5f6368;text-align:center}
.ui-chip{position:absolute;z-index:970;display:flex;align-items:center;gap:7px;background:#e8f0fe;border:1px solid #aecbfa;color:#174ea6;border-radius:16px;padding:5px 9px;font:500 12px Roboto,Arial,sans-serif;box-shadow:0 1px 2px rgba(60,64,67,.12)}
.ui-chip button{border:0;background:transparent;color:#174ea6;cursor:pointer;font-size:15px;line-height:1;padding:0}
.ui-tooltip{position:absolute;z-index:6400;pointer-events:none;background:#fff;border:1px solid #dadce0;border-radius:7px;box-shadow:0 4px 14px rgba(60,64,67,.20);padding:8px 10px;font:12px Roboto,Arial,sans-serif;color:#202124;display:none;min-width:125px}
.ui-crosshair{position:absolute;z-index:899;width:1px;background:#dadce0;pointer-events:none;display:none}
.ui-feedback textarea{width:100%;min-height:90px;border:1px solid #dadce0;border-radius:7px;padding:9px;resize:vertical;font:13px Roboto,Arial,sans-serif;box-sizing:border-box;outline:none}
.ui-feedback textarea:focus{border-color:#1a73e8;box-shadow:0 0 0 1px #1a73e8}
.c{transition:box-shadow .16s ease}
.c:hover{box-shadow:0 2px 8px rgba(60,64,67,.22)}
@keyframes popIn{from{opacity:0;transform:translateY(-5px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes lineDraw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}


/* sidebar now lives in the same scaled canvas as the report */
.portal-nav-mask,.portal-nav{translate:0 0!important}
.portal-nav-mask{
  position:absolute;left:0;z-index:4998;background:#f8fafd;pointer-events:none
}
.portal-nav{
  position:absolute;left:0;z-index:5000;
  background:#f8fafd;border-right:1px solid #e3e5e8;
  font-family:'Google Sans',Roboto,Arial,sans-serif;color:#202124;

.portal-nav *{box-sizing:border-box}
.portal-nav-title{
  padding:4px 12px 10px;font-size:12px;color:#5f6368;
  text-transform:uppercase;letter-spacing:.45px;font-weight:500
}
.portal-nav a{
  display:flex;align-items:center;gap:12px;width:100%;min-height:42px;
  padding:9px 12px;margin:2px 0;border-radius:21px;text-decoration:none;
  color:#202124;font-size:15px;font-weight:500;line-height:20px;
  transition:background .12s ease,color .12s ease;
}
.portal-nav a:hover{background:#eef3fb}
.portal-nav a.active{background:#d3e3fd;color:#0b57d0}
.portal-nav .picon{
  width:22px;min-width:22px;text-align:center;color:#5f6368;font-size:15px
}
.portal-nav a.active .picon{color:#0b57d0}
.portal-nav .pdivider{height:1px;background:#dadce0;margin:9px 5px}
@view-transition{navigation:auto}
.portal-nav{view-transition-name:portal-sidebar}
::view-transition-old(portal-sidebar),::view-transition-new(portal-sidebar){animation-duration:0s}


/* GA-like content-height page ending */
html,body{background:#f8fafd!important}
#w{background:#f8fafd;padding-bottom:28px;box-sizing:border-box}

 downloadCSV(){if(!this.exportRows.length){this.toast('No tabular data is available for this report');return}const blob=new Blob([this.csv()],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=this.exportName+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);this.toast('CSV download started')},
 share(){const data={title:document.title,text:'Rieng254 Analytics report',url:location.href};if(navigator.share){navigator.share(data).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(location.href).then(()=>this.toast('Report link copied')).catch(()=>this.toast('Copy the URL from the address bar'))}else this.toast('Copy the URL from the address bar')},
 simpleMenu(x,y){this.pop(x,y,[{label:'Share link',icon:'↗',action:()=>this.share()},{label:'Download CSV',icon:'⇩',action:()=>this.downloadCSV()},{label:'Print / Save as PDF',icon:'▣',action:()=>window.print()},'---',{label:'Refresh report',icon:'↻',action:()=>{this.animate();this.toast('Report refreshed')}}],'Share & export','Actions for this report',286)},
 dateMeta:{
  'Last 7 days':{dates:'Nov 3 - Nov 9, 2026',compare:'Compare: Oct 27 - Nov 2, 2026'},
  'Last 30 days':{dates:'Oct 11 - Nov 9, 2026',compare:'Compare: Sep 11 - Oct 10, 2026'},
  'Last 90 days':{dates:'Aug 12 - Nov 9, 2026',compare:'Compare: May 14 - Aug 11, 2026'}
 },
 range(x,y){const saved=localStorage.getItem('riengGaRange');const cmp=localStorage.getItem('riengGaCompare')!=='off';const items=Object.keys(this.dateMeta).map(k=>({label:k,icon:saved===k?'✓':'',selected:saved===k,action:()=>this.setDate(k,this.dateMeta[k].dates,true)}));items.push('---',{label:(cmp?'✓ ':'')+'Compare to previous period',icon:'≋',action:()=>{localStorage.setItem('riengGaCompare',cmp?'off':'on');const key=localStorage.getItem('riengGaRange')||this.currentDateKey();this.setDate(key,this.dateMeta[key]?.dates||'',true)}},{label:'Custom range…',icon:'▦',action:()=>this.customRange()});this.pop(x,y,items,'Date range','Changing the range persists across reports',292)},
 currentDateKey(){const d=[...S.querySelectorAll('.t')].find(e=>/Last (90|30|7) days/.test(e.textContent));const m=d?.textContent.match(/Last (?:90|30|7) days/);return m?.[0]||'Last 90 days'},
 customRange(){this.modal('Custom date range','<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label>Start<br><input id="gaStart" type="date" value="2026-08-12" style="margin-top:5px;width:100%;padding:8px;border:1px solid #dadce0;border-radius:6px"></label><label>End<br><input id="gaEnd" type="date" value="2026-11-09" style="margin-top:5px;width:100%;padding:8px;border:1px solid #dadce0;border-radius:6px"></label></div>',[{label:'Cancel',action:c=>c()},{label:'Apply',primary:true,action:(c,bg)=>{const a=bg.querySelector('#gaStart').value,z=bg.querySelector('#gaEnd').value;if(!a||!z){this.toast('Choose both dates');return}localStorage.setItem('riengGaRange','Custom');localStorage.setItem('riengGaCustom',JSON.stringify([a,z]));const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});this.setDate('Custom',fmt(a)+' - '+fmt(z),false);c()}}])},
 setDate(label,dates,persist=true){const d=[...S.querySelectorAll('.t')].find(e=>/Last (90|30|7) days|Custom/.test(e.textContent));if(d)d.innerHTML=label+' &nbsp;&nbsp;'+dates;const cmp=localStorage.getItem('riengGaCompare')!=='off';const ce=[...S.querySelectorAll('.t')].filter(e=>/^Compare:/.test(e.textContent.trim()));ce.forEach(e=>{e.style.display=cmp?'':'none';if(cmp&&this.dateMeta[label])e.textContent=this.dateMeta[label].compare});if(persist){localStorage.setItem('riengGaRange',label);this.toast('Date range applied across reports')}this.animate()},
 restoreDate(){const k=localStorage.getItem('riengGaRange');if(!k)return;if(k==='Custom'){try{const [a,z]=JSON.parse(localStorage.getItem('riengGaCustom')||'[]');if(a&&z){const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});this.setDate('Custom',fmt(a)+' - '+fmt(z),false)}}catch{}}else if(this.dateMeta[k])this.setDate(k,this.dateMeta[k].dates,false)},
 searchInput(x,y,w,h,placeholder,bg='#eceff1',fs='15px'){const input=this.input(x,y,w,h,placeholder,()=>{},bg,fs);input.autocomplete='off';let active=-1;const draw=()=>{S.querySelector('.ui-search-results')?.remove();const q=input.value.trim().toLowerCase();const matches=this.routes.filter(r=>!q||(r.label+' '+r.keys).toLowerCase().includes(q)).slice(0,5);if(!matches.length)return;const p=document.createElement('div');p.className='ui-search-results';p.style.cssText=\`left:\${x}px;top:\${y+h}px;width:\${w}px\`;matches.forEach((r,i)=>{const a=document.createElement('a');a.href=r.url;a.dataset.i=i;a.innerHTML='<span class="sicon">'+r.icon+'</span><span>'+r.label+'</span>';p.appendChild(a)});S.appendChild(p);active=-1};input.addEventListener('focus',draw);input.addEventListener('input',draw);input.addEventListener('keydown',e=>{const p=S.querySelector('.ui-search-results');if(!p)return;const links=[...p.querySelectorAll('a')];if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();active=(active+(e.key==='ArrowDown'?1:-1)+links.length)%links.length;links.forEach((a,i)=>a.classList.toggle('active',i===active))}else if(e.key==='Enter'){e.preventDefault();(links[active>=0?active:0])?.click()}else if(e.key==='Escape')p.remove()});input.addEventListener('click',e=>e.stopPropagation());return input},
 comparison(x,y,chipX,chipY){const current=localStorage.getItem('riengGaComparison')||'';const options=['All users','Mobile users','Desktop users','Organic Search','Direct'];this.pop(x,y,options.map(v=>({label:v,icon:v===current?'✓':'',selected:v===current,action:()=>this.applyComparison(v,chipX,chipY)})),'Add comparison','Compare a subset of the report',278)},
 applyComparison(label,x,y){localStorage.setItem('riengGaComparison',label);this.showComparisonChip(label,x,y);this.toast('Comparison applied: '+label);this.animate()},
 showComparisonChip(label,x,y){S.querySelector('.ui-chip.compare-chip')?.remove();if(!label)return;const c=document.createElement('div');c.className='ui-chip compare-chip';c.style.cssText=\`left:\${x}px;top:\${y}px\`;c.innerHTML='<span>Compare: '+label+'</span><button aria-label="Remove comparison">×</button>';c.querySelector('button').onclick=()=>{localStorage.removeItem('riengGaComparison');c.remove();this.toast('Comparison removed')};S.appendChild(c)},
 restoreComparison(x,y){const v=localStorage.getItem('riengGaComparison');if(v)this.showComparisonChip(v,x,y)},
 filterPanel(x,y,rows){const p=this.pop(x,y,[],'Filter','Choose values to include',276);const selected=new Set(rows.map(r=>r[0]));rows.forEach(([name])=>{const l=document.createElement('label');l.style.cssText='display:flex;align-items:center;gap:9px;padding:8px 10px;font:13px Roboto,Arial,sans-serif;cursor:pointer';l.innerHTML='<input type="checkbox" checked value="'+name+'"><span>'+name+'</span>';p.appendChild(l)});const d=document.createElement('div');d.className='ui-pop-divider';p.appendChild(d);const row=document.createElement('div');row.style.cssText='display:flex;gap:8px;justify-content:flex-end;padding:7px';row.innerHTML='<button data-reset style="width:auto">Reset</button><button data-apply style="width:auto;background:#1a73e8;color:#fff">Apply</button>';p.appendChild(row);row.querySelector('[data-reset]').onclick=e=>{e.stopPropagation();p.querySelectorAll('input').forEach(i=>i.checked=true)};row.querySelector('[data-apply]').onclick=e=>{e.stopPropagation();const keep=new Set([...p.querySelectorAll('input:checked')].map(i=>i.value));rows.forEach(([name,yy])=>{const show=keep.has(name);[...S.children].forEach(el=>{const top=parseFloat(el.style.top);if((el.classList.contains('t')||el.classList.contains('b'))&&Number.isFinite(top)&&Math.abs(top-yy)<18)el.style.opacity=show?'1':'.15'})});p.remove();this.toast('Filter applied')};return p},
 dataQuality(x,y,warning=false){this.pop(x,y,[{label:'All available snapshot data is shown',icon:warning?'⚠':'✓',disabled:true},'---',{label:'Refresh report',icon:'↻',action:()=>{this.animate();this.toast('Report refreshed')}}],'Data quality',warning?'This static portal mirrors the report snapshot; no live GA threshold metadata is connected.':'This static portal mirrors the report snapshot; no live GA threshold metadata is connected.',310)},
 apps(x,y){this.pop(x,y,this.routes.map(r=>({label:r.label,icon:r.icon,href:r.url})),'Analytics sections','Jump to another report',260)},
 help(x,y){this.pop(x,y,[{label:'Search reports from the top search bar',icon:'⌕',disabled:true},{label:'Use the date picker to change the range',icon:'▦',disabled:true},{label:'Use Share & export for CSV/PDF',icon:'⇩',disabled:true}], 'Quick help','Controls in this portal follow GA report patterns.',300)},
 profile(x,y){this.pop(x,y,[{label:'Rieng254 Analytics',icon:'R',disabled:true},{label:'Property: rieng254.com',icon:'◆',disabled:true},'---',{label:'Copy current report link',icon:'⧉',action:()=>this.share()},{label:'Reports snapshot',icon:'⌂',href:'Analytics _ Reports snapshot.html'}],'Account','Rieng254 reporting portal',285)},
 notifications(x,y){this.pop(x,y,[{label:'No report alerts',icon:'✓',disabled:true}], 'Notifications','The static portal has no live alert feed.',260)},
 rowsMenu(x,y,yHint,loaded){const choices=[10,25,50];this.pop(x,y,choices.map(n=>({label:String(n)+' rows per page',selected:n===10,action:()=>{const nums=[...S.querySelectorAll('.t')].filter(e=>/^\\d+$/.test(e.textContent.trim())&&Math.abs(parseFloat(e.style.top)-yHint)<25);if(nums[0])nums[0].textContent=n;this.toast('Rows per page set to '+n+(loaded<n?' ('+loaded+' rows loaded in this snapshot)':''))}})),'Rows per page','Display preference for this report',250)},
 snapshotNext(){this.toast('This static snapshot contains the rows currently shown')},
 pagesModal(){const rows=[['Rieng254 – Home','249K'],['Rieng254 – Trending','161K'],['Rieng254 – Videos','131K'],['Rieng254 – Shows','73K'],['Rieng254 – Albums & Songs','57K'],['Rieng254 – DJ Mix Sales','42K'],['Rieng254 – BoB Pre-order','29K']];this.modal('Pages and screens','<div style="display:grid;grid-template-columns:1fr auto;gap:9px 18px">'+rows.map(r=>'<div>'+r[0]+'</div><div style="font-weight:500">'+r[1]+'</div>').join('')+'</div>',[{label:'Close',action:c=>c()}])},
 feedback(){const bg=this.modal('Send feedback','<div class="ui-feedback"><div style="margin-bottom:9px;color:#5f6368">Feedback is stored in this browser only.</div><textarea placeholder="Tell us what should be improved…"></textarea></div>',[{label:'Cancel',action:c=>c()},{label:'Submit',primary:true,action:(c,bg)=>{const v=bg.querySelector('textarea').value.trim();if(!v){this.toast('Enter feedback first');return}const arr=JSON.parse(localStorage.getItem('riengGaFeedback')||'[]');arr.push({at:new Date().toISOString(),message:v});localStorage.setItem('riengGaFeedback',JSON.stringify(arr));c();this.toast('Feedback saved')}}]);return bg},
 chartHover(x,y,w,h,maxValue,seriesNames=[]){const hit=document.createElement('div');hit.className='b';hit.style.cssText=\`left:\${x}px;top:\${y}px;width:\${w}px;height:\${h}px;z-index:898;background:transparent\`;const tip=document.createElement('div');tip.className='ui-tooltip';const line=document.createElement('div');line.className='ui-crosshair';line.style.top=y+'px';line.style.height=h+'px';S.appendChild(line);S.appendChild(tip);const paths=[...S.querySelectorAll('svg path[data-chart-series]')].filter(p=>{try{const b=p.getBBox();return b.x+b.width>=x&&b.x<=x+w&&b.y+b.height>=y&&b.y<=y+h}catch{return false}});const pointAtX=(p,target)=>{let lo=0,hi=p.getTotalLength();for(let i=0;i<13;i++){const m=(lo+hi)/2,pt=p.getPointAtLength(m);if(pt.x<target)lo=m;else hi=m}return p.getPointAtLength((lo+hi)/2)};hit.onmousemove=e=>{const target=x+e.offsetX;line.style.left=target+'px';line.style.display='block';const vals=paths.map((p,i)=>{const pt=pointAtX(p,target);const v=Math.max(0,maxValue*(y+h-pt.y)/h);return {name:seriesNames[i]||('Series '+(i+1)),v,color:p.getAttribute('stroke')||'#1a73e8'}});tip.innerHTML=vals.map(v=>'<div style="display:flex;justify-content:space-between;gap:18px;margin:3px 0"><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+v.color+';margin-right:6px"></i>'+v.name+'</span><b>'+this.formatMetric(v.v)+'</b></div>').join('');tip.style.left=Math.min(x+w-175,target+10)+'px';tip.style.top=Math.max(y+4,y+e.offsetY-10)+'px';tip.style.display='block'};hit.onmouseleave=()=>{tip.style.display='none';line.style.display='none'};S.appendChild(hit)},
 formatMetric(v){if(v>=1000000)return (v/1000000).toFixed(v>=10000000?0:1)+'M';if(v>=1000)return (v/1000).toFixed(v>=10000?0:1)+'K';return Math.round(v).toLocaleString()},
 animate(){S.querySelectorAll('svg path[data-chart-series]').forEach(p=>{try{const len=p.getTotalLength();if(len>60){if(p.getAttribute('stroke-dasharray')){p.style.animation='none';p.style.transition='none';p.style.opacity='0';requestAnimationFrame(()=>{p.style.transition='opacity .55s ease';p.style.opacity='1'})}else{p.style.strokeDasharray=Math.max(len,1200);p.style.strokeDashoffset=Math.max(len,1200);p.style.animation='none';void p.getBBox();p.style.animation='lineDraw .85s ease forwards'}}}catch{}});S.querySelectorAll('.b').forEach(e=>{const r=e.getBoundingClientRect(),bg=getComputedStyle(e).backgroundColor;if((bg==='rgb(26, 115, 232)'||bg==='rgb(37, 99, 224)')&&r.width>18&&r.height<=65&&parseFloat(e.style.left||'0')>260){e.style.transformOrigin='left center';e.style.animation='barGrow .55s ease both'}})},
 filterRows(term,rows){term=term.trim().toLowerCase();rows.forEach(([name,y])=>{const show=!term||name.toLowerCase().includes(term);[...S.children].forEach(el=>{const top=parseFloat(el.style.top);if((el.classList.contains('t')||el.classList.contains('b'))&&Number.isFinite(top)&&Math.abs(top-y)<18)el.style.opacity=show?'1':'.15'})})}
};

const PortalNav={
  routes:{
    reports:'Analytics _ Reports snapshot.html',

    acquisition:'Traffic acquisition.html',
    demographics:'Demographic details_ Country.html',

  },
  icons:{reports:'⌂',campaigns:'◫',acquisition:'↗',demographics:'◉',tech:'▣'},
  mount(opts){
    S.querySelector('.portal-nav')?.remove();
    S.querySelector('.portal-nav-mask')?.remove();

    const mask=document.createElement('div');
    mask.className='portal-nav-mask';
    mask.style.cssText='top:'+opts.top+'px;width:'+opts.maskWidth+'px;height:'+opts.height+'px';
    S.appendChild(mask);

    const nav=document.createElement('nav');
    nav.className='portal-nav';
    nav.setAttribute('aria-label','Analytics portal navigation');
    nav.style.cssText='top:'+opts.top+'px;width:'+opts.width+'px;height:'+opts.height+'px';
    nav.innerHTML=
      '<div class="portal-nav-title">Reports</div>'+
      Object.keys(this.routes).map(key=>
        '<a href="'+this.routes[key]+'" class="'+(opts.active===key?'active':'')+'" data-key="'+key+'"'+(opts.active===key?' aria-current="page"':'')+'>'+
          '<span class="picon">'+this.icons[key]+'</span>'+
          '<span>'+this.labels[key]+'</span>'+
        '</a>'
      ).join('');
    S.appendChild(nav);

    nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{
      const current=decodeURIComponent(location.pathname.split('/').pop()||'');
      if(current===a.getAttribute('href'))e.preventDefault();
    }));
  }
};
