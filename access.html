<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Nicoo Furniture Analytics Access</title>
</head>
<body>
  <p>Opening your Nicoo Furniture Analytics invitation.</p>
  <a id="continue" href="https://www.nicoofurniture.co.ke/Analytics/web/access.html">Continue to Nicoo Furniture Analytics</a>
  <script>
    const link = document.getElementById('continue');
    const destination = new URL(link.href);
    const query = new URLSearchParams(location.search);
    for (const name of ['email', 'token']) {
      const value = query.get(name);
      if (value) destination.searchParams.set(name, value);
    }
    link.href = destination.href;
    location.replace(destination.href);
  </script>
</body>
</html>
