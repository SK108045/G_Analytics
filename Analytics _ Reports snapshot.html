html,body{margin:0;background:#f4f6f8}
body{overflow-x:hidden;font-family:'Google Sans',Roboto,Arial,sans-serif;color:#202124}
#w{width:100%;overflow:hidden}
#s{position:relative;width:1600px;height:818px;transform-origin:0 0;background:#f4f6f8;overflow:hidden}
#s>*{translate:0 -82px}
.t{position:absolute;transform:translateY(-50%);white-space:nowrap}
.b{position:absolute}
.c{position:absolute;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(60,64,67,.18)}

/* interaction layer: intentionally does not change the screenshot layout */
.hotspot{position:absolute;z-index:900;border:0;padding:0;margin:0;background:transparent;cursor:pointer;border-radius:8px;font:inherit}
.hotspot:hover{background:rgba(26,115,232,.055)}
.hotspot:active{background:rgba(26,115,232,.10)}
.real-input{position:absolute;z-index:910;border:0;outline:0;color:#202124;font:inherit;box-sizing:border-box}
.real-input:focus{box-shadow:inset 0 0 0 2px rgba(26,115,232,.22)}
.ui-pop{position:absolute;z-index:1200;min-width:210px;background:#fff;border:1px solid #dadce0;border-radius:8px;box-shadow:0 8px 24px rgba(60,64,67,.22);padding:6px;display:none}
.ui-pop.open{display:block;animation:popIn .14s ease-out}
.ui-pop button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:9px 11px;border-radius:6px;color:#202124;font:500 13px Roboto,Arial,sans-serif;cursor:pointer}
.ui-pop button:hover{background:#f1f3f4}
.ui-toast{position:absolute;z-index:1300;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:#303134;color:#fff;border-radius:5px;padding:10px 15px;font:13px Roboto,Arial,sans-serif;opacity:0;pointer-events:none;transition:.18s}
.ui-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes popIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes lineDraw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}



/* one shared visible left navbar across every analytics page */
#s>.global-nav{translate:0 0!important}
.global-nav{
  position:absolute;left:0;z-index:2000;background:#f8fafd;border-right:1px solid #e3e5e8;
  overflow:hidden;font-family:'Google Sans',Roboto,Arial,sans-serif;color:#202124
}
.global-nav *{box-sizing:border-box}
.global-nav-inner{height:100%;padding:10px 10px 14px;display:flex;flex-direction:column}
.g-nav-item,.g-nav-section{
  width:100%;border:0;background:transparent;color:#202124;text-decoration:none;
  display:flex;align-items:center;gap:12px;min-height:40px;padding:8px 12px;border-radius:20px;
  font-size:15px;font-weight:500;line-height:20px;text-align:left;cursor:pointer
}
.g-nav-item:hover,.g-nav-section:hover{background:#eef3fb}
.g-nav-item.active{background:#d3e3fd;color:#0b57d0}
.g-nav-icon{width:22px;min-width:22px;text-align:center;color:#5f6368;font-size:15px}
.g-nav-item.active .g-nav-icon{color:#0b57d0}
.g-nav-section{font-weight:400;color:#5f6368;cursor:pointer}
.g-nav-caret{margin-left:auto;color:#5f6368;font-size:13px;transition:transform .15s ease}
.g-nav-group.collapsed .g-nav-caret{transform:rotate(-90deg)}
.g-nav-group.collapsed .g-nav-children{display:none}
.g-nav-child{padding-left:27px}
.g-nav-divider{height:1px;background:#dadce0;margin:7px 4px}
.g-nav-spacer{flex:1;min-height:18px}
.g-nav-bottom{border-top:1px solid #dadce0;padding-top:8px}

 hit(x,y,w,h,fn,title=''){const b=document.createElement('button');b.className='hotspot';b.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;b.title=title;b.setAttribute('aria-label',title||'control');b.onclick=e=>{e.stopPropagation();fn(e)};S.appendChild(b);return b},
 link(x,y,w,h,url,title=''){return this.hit(x,y,w,h,()=>location.href=url,title)},
 input(x,y,w,h,placeholder,onInput,bg='#fff',fs='14px'){const i=document.createElement('input');i.className='real-input';i.type='search';i.placeholder=placeholder;i.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${bg};font-size:${fs};padding:0 10px;border-radius:4px`;i.addEventListener('input',()=>onInput?.(i.value));S.appendChild(i);return i},
 pop(x,y,items){document.querySelectorAll('.ui-pop').forEach(p=>p.remove());const p=document.createElement('div');p.className='ui-pop';p.style.left=x+'px';p.style.top=y+'px';items.forEach(([label,fn])=>{const b=document.createElement('button');b.textContent=label;b.onclick=e=>{e.stopPropagation();fn();p.classList.remove('open')};p.appendChild(b)});S.appendChild(p);requestAnimationFrame(()=>p.classList.add('open'));return p},
 toast(msg){let t=S.querySelector('.ui-toast');if(!t){t=document.createElement('div');t.className='ui-toast';S.appendChild(t)}t.textContent=msg;t.classList.add('show');clearTimeout(UI.tt);UI.tt=setTimeout(()=>t.classList.remove('show'),1500)},
 range(x,y){this.pop(x,y,[['Last 7 days',()=>UI.setDate('Last 7 days','Nov 3 - Nov 9, 2026')],['Last 30 days',()=>UI.setDate('Last 30 days','Oct 11 - Nov 9, 2026')],['Last 90 days',()=>UI.setDate('Last 90 days','Aug 12 - Nov 9, 2026')]])},
 setDate(label,dates){const d=[...S.querySelectorAll('.t')].find(e=>/Last (90|30|7) days/.test(e.textContent));if(d){d.innerHTML=label+' &nbsp;&nbsp;'+dates;UI.toast('Date range updated')}},
 simpleMenu(x,y){this.pop(x,y,[['Refresh report',()=>{UI.animate();UI.toast('Report refreshed')}],['Share',()=>navigator.clipboard?.writeText(location.href).then(()=>UI.toast('Link copied')).catch(()=>UI.toast('Share link ready'))],['Export',()=>UI.toast('Export prepared')]])},
 animate(){S.querySelectorAll('svg path[data-chart-series]').forEach(p=>{try{const len=p.getTotalLength();if(len>60){if(p.getAttribute('stroke-dasharray')){p.style.animation='none';p.style.transition='none';p.style.opacity='0';requestAnimationFrame(()=>{p.style.transition='opacity .55s ease';p.style.opacity='1'})}else{p.style.strokeDasharray=Math.max(len,1200);p.style.strokeDashoffset=Math.max(len,1200);p.style.animation='none';void p.getBBox();p.style.animation='lineDraw .85s ease forwards'}}}catch{}});S.querySelectorAll('.b').forEach(e=>{const r=e.getBoundingClientRect(),bg=getComputedStyle(e).backgroundColor;if(((bg==='rgb(26, 115, 232)'||bg==='rgb(37, 99, 224)')&&parseFloat(e.style.left)>280&&parseFloat(e.style.top)>140&&r.width>18&&r.height<=65)){e.style.transformOrigin='left center';e.style.animation='barGrow .55s ease both'}})},
 filterRows(term,rows){term=term.trim().toLowerCase();rows.forEach(([name,y])=>{const show=!term||name.toLowerCase().includes(term);[...S.children].forEach(el=>{const top=parseFloat(el.style.top);if(el.classList.contains('t')&&Number.isFinite(top)&&Math.abs(top-y)<18)el.style.opacity=show?'1':'.14'})})}
};
document.addEventListener('click',()=>document.querySelectorAll('.ui-pop').forEach(p=>p.classList.remove('open')));

/* shared visible navbar */
const GlobalNav={
  routes:{
    reports:'Analytics _ Reports snapshot.html',
    campaigns:'Reports snapshot with campaigns and cohorts.html',
    acquisition:'Traffic acquisition.html',
    demographics:'Demographic details_ Country.html',
    tech:'Tech details_ Device category.html'
  },
  go(key,label){
    const url=this.routes[key];
    if(url){const current=decodeURIComponent(location.pathname.split('/').pop()||'');if(current===url){UI.toast(label+' is already open');return}location.href=url}
    else UI.toast(label+' section opened');
  },
  mount(opts){
    S.querySelector('.global-nav')?.remove();
    const nav=document.createElement('aside');
    nav.className='global-nav';
    nav.setAttribute('aria-label','Analytics navigation');
    nav.style.cssText='top:'+opts.top+'px;width:'+opts.width+'px;height:'+opts.height+'px';
    const active=opts.active;
    nav.innerHTML=
      '<div class="global-nav-inner">'+
        '<a href="'+this.routes.reports+'" class="g-nav-item '+(active==='reports'?'active':'')+'" data-key="reports"><span class="g-nav-icon">⌂</span><span>Reports snapshot</span></a>'+'<a href="'+this.routes.campaigns+'" class="g-nav-item '+(active==='campaigns'?'active':'')+'" data-key="campaigns"><span class="g-nav-icon">◫</span><span>Campaigns &amp; cohorts</span></a>'+
        '<button class="g-nav-item" data-toast="Realtime"><span class="g-nav-icon">◴</span><span>Realtime</span></button>'+
        '<div class="g-nav-divider"></div>'+
        '<div class="g-nav-group" data-group="life">'+
          '<button class="g-nav-section"><span>Life cycle</span><span class="g-nav-caret">⌃</span></button>'+
          '<div class="g-nav-children">'+
            '<a href="'+this.routes.acquisition+'" class="g-nav-item g-nav-child '+(active==='acquisition'?'active':'')+'" data-key="acquisition"><span class="g-nav-icon">▶</span><span>Acquisition</span></a>'+
            '<button class="g-nav-item g-nav-child" data-toast="Engagement"><span class="g-nav-icon">▶</span><span>Engagement</span></button>'+
            '<button class="g-nav-item g-nav-child" data-toast="Monetization"><span class="g-nav-icon">⊙</span><span>Monetization</span></button>'+
            '<button class="g-nav-item g-nav-child" data-toast="Retention"><span class="g-nav-icon">◇</span><span>Retention</span></button>'+
          '</div>'+
        '</div>'+
        '<div class="g-nav-divider"></div>'+
        '<div class="g-nav-group" data-group="user">'+
          '<button class="g-nav-section"><span>User</span><span class="g-nav-caret">⌃</span></button>'+
          '<div class="g-nav-children">'+
            '<a href="'+this.routes.demographics+'" class="g-nav-item g-nav-child '+(active==='demographics'?'active':'')+'" data-key="demographics"><span class="g-nav-icon">◉</span><span>Demographics</span></a>'+
            '<a href="'+this.routes.tech+'" class="g-nav-item g-nav-child '+(active==='tech'?'active':'')+'" data-key="tech"><span class="g-nav-icon">▣</span><span>Tech</span></a>'+
          '</div>'+
        '</div>'+
        '<div class="g-nav-spacer"></div>'+
        '<div class="g-nav-bottom">'+
          '<button class="g-nav-item" data-toast="Library"><span class="g-nav-icon">▭</span><span>Library</span></button>'+
          '<button class="g-nav-item" data-toast="Admin"><span class="g-nav-icon">⚙</span><span>Admin</span></button>'+
        '</div>'+
      '</div>';
    S.appendChild(nav);

    nav.querySelectorAll('.g-nav-section').forEach(b=>b.addEventListener('click',()=>{
      b.closest('.g-nav-group').classList.toggle('collapsed');
    }));
    nav.querySelectorAll('[data-toast]').forEach(b=>b.addEventListener('click',()=>UI.toast(b.dataset.toast+' opened')));
    nav.querySelectorAll('a[data-key]').forEach(a=>a.addEventListener('click',e=>{
      const current=decodeURIComponent(location.pathname.split('/').pop()||'');
      if(current===a.getAttribute('href')){e.preventDefault();UI.toast(a.textContent.trim()+' is already open')}
    }));
  }
};
