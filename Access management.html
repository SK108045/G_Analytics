<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytics | Access management</title><link rel="stylesheet" href="ga-extra.css"><style>body{background:#f8fafd;font-family:Roboto,Arial,sans-serif;margin:0;color:#202124}.page{max-width:900px;margin:0 auto;padding:38px 22px}.head{display:flex;align-items:center;gap:13px;margin-bottom:20px}.head h1{font-size:24px;font-weight:500;margin:0}.card{background:#fff;border:1px solid #dadce0;border-radius:10px;padding:22px}.grid{display:grid;grid-template-columns:1fr 220px;gap:14px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:600}.field input,.field select{height:40px;border:1px solid #dadce0;border-radius:5px;padding:0 10px;font:13px Roboto,Arial}.check{display:flex;align-items:center;gap:8px;margin:16px 0;font-size:13px}.actions{display:flex;gap:9px}.primary,.secondary{height:38px;border-radius:5px;padding:0 14px;font-weight:600;cursor:pointer}.primary{border:0;background:#1a73e8;color:#fff}.secondary{border:1px solid #dadce0;background:#fff}.result{margin-top:17px;padding:12px;border-radius:6px;background:#f8fafd;font-size:13px;white-space:pre-wrap;display:none}.note{font-size:12px;color:#5f6368;margin-top:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="page"><div class="head"><div style="font-size:24px">👤</div><div><h1>Access management</h1><div class="note">Invite someone to view the analytics portal.</div></div></div><section class="card"><div class="grid"><div class="field"><label>User email</label><input id="email" type="email" placeholder="name@example.com"></div><div class="field"><label>Role</label><select id="role"><option>Viewer</option><option>Analyst</option></select></div></div><label class="check"><input id="notify" type="checkbox" checked> Notify new user by email</label><div class="field" style="margin-bottom:14px"><label>Admin invite key</label><input id="adminKey" type="password" autocomplete="off" placeholder="Required to send invites"><div class="note">Kept in this tab only and never written to the repository.</div></div><div class="actions"><button class="primary" id="send">Send invitation</button><a class="secondary" style="display:inline-grid;place-items:center;text-decoration:none;color:#3c4043" href="Analytics%20_%20Reports%20snapshot.html">Back to reports</a></div><div class="result" id="result"></div></section></main><script>const API='https://g-analytics-invite.johnwakaba146.workers.dev',email=document.getElementById('email'),role=document.getElementById('role'),notify=document.getElementById('notify'),key=document.getElementById('adminKey'),result=document.getElementById('result'),send=document.getElementById('send');key.value=sessionStorage.getItem('gaInviteAdminKey')||'';send.onclick=async()=>{const e=email.value.trim().toLowerCase();if(!e||!e.includes('@')){result.style.display='block';result.textContent='Enter a valid email address.';return}if(!key.value.trim()){result.style.display='block';result.textContent='Enter the admin invite key.';return}sessionStorage.setItem('gaInviteAdminKey',key.value.trim());send.disabled=true;send.textContent='Sending…';try{const r=await fetch(API+'/invite',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+key.value.trim()},body:JSON.stringify({email:e,role:role.value,send:notify.checked})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Invite failed');result.style.display='block';result.textContent=(data.sent?'Invitation email sent.':'Invite link created.')+'\n'+data.accessUrl}catch(err){result.style.display='block';result.textContent=err.message||'Invite failed'}finally{send.disabled=false;send.textContent='Send invitation'}};</script></body></html>
